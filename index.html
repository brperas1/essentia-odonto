<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#07365c"><title>Essentia Odonto</title><style> *{box-sizing:border-box}body{margin:0;background:#f4f6fa;font:16px system-ui;color:#17333b}header{background:#07365c;color:white;padding:20px;border-bottom:4px solid #c99a35}main{max-width:650px;margin:auto;padding:16px}nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}button,input,select{font:inherit;padding:11px;border-radius:9px;border:1px solid #b9ced1}button{background:#07365c;color:white;border:0;cursor:pointer}input,select{width:100%;margin:5px 0 10px;background:white}section,article{background:white;border-radius:14px;padding:16px;margin-bottom:12px}label{display:block;font-size:14px}h2{margin-top:0}small{color:#53686d}.danger{background:#a33} .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tiles article{margin:0} </style><header><img src="logo.jpg" alt="Essentia Odonto" style="display:block;width:220px;max-width:100%;border-radius:10px;margin-bottom:12px"><b>Essentia Odonto</b><div><small style="color:white">Protótipo local • somente dados fictícios</small></div></header><main><label>Perfil de demonstração<select id="role"><option>Dentista</option><option>Recepcionista</option></select></label><nav id="nav"></nav><div id="view"></div></main><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), today=()=>new Date().toLocaleDateString('sv-SE');let db={p:[],a:[],f:[]};try{db=JSON.parse(localStorage.getItem('odonto-demo'))||db}catch{}let page='Início';const save=()=>{try{localStorage.setItem('odonto-demo',JSON.stringify(db))}catch{alert('Não foi possível salvar neste navegador.')}render()}, id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2), name=x=>db.p.find(p=>p.id===x)?.nome||'Não informado';function go(p){page=p;render()}function field(n,t='text',v=''){return `<label>${n}<input name="${n}" type="${t}" value="${esc(v)}" required ${t==='number'?'min="0.01" step="0.01"':''}></label>`}function sel(n,opts){return `<label>${n}<select name="${n}" required>${opts.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select></label>`}const patients=()=>sel('Paciente',db.p.map(p=>[p.id,p.nome]));function form(body){return `<section><form id="entry">${body}<button>Salvar</button></form></section>`}function del(k,i){if(confirm('Excluir registro?')){db[k]=db[k].filter(x=>x.id!==i);save()}}function status(k,i,v){db[k].find(x=>x.id===i).status=v;save()}function render(){let dentist=$('role').value==='Dentista';let pages=['Início','Pacientes','Agenda',...(dentist?['Financeiro']:[])];if(!pages.includes(page))page='Início';$('nav').innerHTML=pages.map(p=>`<button onclick="go('${p}')">${p}</button>`).join('');let h=`<h2>${page}</h2>`;if(page==='Início'){let m=today().slice(0,7),f=db.f.filter(x=>x.data.startsWith(m)),r=f.filter(x=>x.tipo==='Entrada'&&x.status==='Pago').reduce((s,x)=>s+x.valor,0),d=f.filter(x=>x.tipo==='Saída'&&x.status==='Pago').reduce((s,x)=>s+x.valor,0);h+=`<div class="tiles"><article>Consultas hoje<h2>${db.a.filter(x=>x.data===today()&&x.status!=='Cancelado').length}</h2></article><article>Pacientes<h2>${db.p.length}</h2></article>${dentist?`<article>Recebido no mês<h2>${money(r)}</h2></article><article>Saldo do mês<h2>${money(r-d)}</h2></article>`:''}</div>`}if(page==='Pacientes'){h+=form(field('Nome')+field('Telefone','tel'));h+=db.p.map(p=>`<article><b>${esc(p.nome)}</b><p>${esc(p.tel)}</p></article>`).join('')}if(page==='Agenda'){h+=db.p.length?form(patients()+field('Data','date',today())+field('Hora','time')+field('Procedimento')):'<section>Cadastre um paciente primeiro.</section>';h+=db.a.slice().sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora)).map(a=>`<article><b>${esc(name(a.pid))}</b><p>${esc(a.data)} • ${esc(a.hora)} • ${esc(a.proc)}</p><label>Situação<select onchange="status('a','${a.id}',this.value)">${['Agendado','Confirmado','Realizado','Faltou','Cancelado'].map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join('')}</select></label><button class="danger" onclick="del('a','${a.id}')">Excluir</button></article>`).join('')}if(page==='Financeiro'){h+=form(sel('Tipo',[['Entrada','Entrada'],['Saída','Saída']])+field('Descrição')+field('Valor','number')+field('Data','date',today())+sel('Forma',['Pix','Dinheiro','Cartão','Boleto'].map(x=>[x,x]))+sel('Situação',[['Pendente','Pendente'],['Pago','Pago']]));h+=`<section>A receber: <b>${money(db.f.filter(x=>x.tipo==='Entrada'&&x.status==='Pendente').reduce((s,x)=>s+x.valor,0))}</b></section>`;h+=db.f.map(x=>`<article><b>${esc(x.desc)} — ${money(x.valor)}</b><p>${esc(x.tipo)} • ${esc(x.data)} • ${esc(x.forma)}</p><label>Situação<select onchange="status('f','${x.id}',this.value)"><option ${x.status==='Pendente'?'selected':''}>Pendente</option><option ${x.status==='Pago'?'selected':''}>Pago</option></select></label><button class="danger" onclick="del('f','${x.id}')">Excluir</button></article>`).join('')} $('view').innerHTML=h;let e=$('entry');if(e)e.onsubmit=ev=>{ev.preventDefault();let f=Object.fromEntries(new FormData(e));if(page==='Pacientes')db.p.push({id:id(),nome:f.Nome,tel:f.Telefone});if(page==='Agenda'){if(db.a.some(a=>a.data===f.Data&&a.hora===f.Hora&&a.status!=='Cancelado'))return alert('Horário já ocupado.');db.a.push({id:id(),pid:f.Paciente,data:f.Data,hora:f.Hora,proc:f.Procedimento,status:'Agendado'})}if(page==='Financeiro')db.f.push({id:id(),tipo:f.Tipo,desc:f['Descrição'],valor:Number(f.Valor),data:f.Data,forma:f.Forma,status:f['Situação']});save()}}$('role').onchange=render;render();</script></html>
